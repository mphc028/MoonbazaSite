name: Deploy Moonbaza

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: moonbaza-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            cd /var/www/moonbaza.com
            git config --global --add safe.directory /var/www/moonbaza.com || true
            git fetch origin main
            git reset --hard origin/main
            rm -f public/hot
            docker compose run --rm --no-deps vite sh -c "npm install && npm run build"
            docker compose up -d app
            until docker compose exec -T app php artisan about >/dev/null 2>&1; do sleep 2; done
            docker compose exec -T app php artisan optimize
